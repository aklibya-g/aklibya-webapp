{% extends "base.html" %}
{% block content %}
<div style="max-width:600px;margin:0 auto">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:24px">
        <h4 style="margin:0;font-weight:800"><i class="bi bi-pencil-square" style="color:var(--primary)"></i> تعديل الرسالة</h4>
        <a href="{% url 'whatsapp_integration' %}" style="font-size:.85rem;font-weight:600;color:var(--text-muted);text-decoration:none"><i class="bi bi-arrow-right"></i> رجوع</a>
    </div>

    <div style="background:var(--card-bg);border-radius:16px;border:1px solid var(--border);padding:24px">
        <form method="POST">
            {% csrf_token %}
            <div style="margin-bottom:16px">
                <label style="font-size:.82rem;font-weight:600;color:var(--text-muted);display:block;margin-bottom:4px">المرسل</label>
                <input type="text" name="sender" value="{{ msg.sender }}" style="width:100%;padding:10px 14px;border-radius:10px;border:1px solid var(--border);font-size:.88rem">
            </div>
            <div style="margin-bottom:16px">
                <label style="font-size:.82rem;font-weight:600;color:var(--text-muted);display:block;margin-bottom:4px">نص الرسالة</label>
                <textarea name="message_text" rows="3" style="width:100%;padding:10px 14px;border-radius:10px;border:1px solid var(--border);font-size:.88rem">{{ msg.message_text }}</textarea>
            </div>
            <div style="margin-bottom:16px">
                <label style="font-size:.82rem;font-weight:600;color:var(--text-muted);display:block;margin-bottom:4px">رقم الهاتف</label>
                <input type="text" name="phone_number" value="{{ prefill.phone|default:msg.phone_number|default:'' }}" style="width:100%;padding:10px 14px;border-radius:10px;border:1px solid var(--border);font-size:.88rem" dir="ltr">
            </div>
            <div style="display:flex;gap:10px;margin-bottom:16px">
                <div style="flex:1">
                    <label style="font-size:.82rem;font-weight:600;color:var(--text-muted);display:block;margin-bottom:4px">المبلغ</label>
                    <input type="number" step="0.01" name="amount" value="{{ prefill.amount|default:msg.amount|default:'' }}" style="width:100%;padding:10px 14px;border-radius:10px;border:1px solid var(--border);font-size:.88rem">
                </div>
                <div style="flex:1">
                    <label style="font-size:.82rem;font-weight:600;color:var(--text-muted);display:block;margin-bottom:4px">سعر الصرف</label>
                    <input type="number" step="0.01" name="exchange_rate" value="{{ prefill.rate|default:msg.exchange_rate|default:'' }}" style="width:100%;padding:10px 14px;border-radius:10px;border:1px solid var(--border);font-size:.88rem">
                </div>
            </div>
            <div style="display:flex;gap:10px;margin-bottom:16px">
                <div style="flex:1">
                    <label style="font-size:.82rem;font-weight:600;color:var(--text-muted);display:block;margin-bottom:4px">العمولة</label>
                    <input type="number" step="0.01" name="commission" value="{{ prefill.commission|default:msg.commission|default:'' }}" style="width:100%;padding:10px 14px;border-radius:10px;border:1px solid var(--border);font-size:.88rem">
                </div>
                <div style="flex:1">
                    <label style="font-size:.82rem;font-weight:600;color:var(--text-muted);display:block;margin-bottom:4px">العملة</label>
                    <input type="text" name="currency" value="{{ prefill.currency|default:msg.currency|default:'' }}" style="width:100%;padding:10px 14px;border-radius:10px;border:1px solid var(--border);font-size:.88rem">
                </div>
            </div>
            <div style="margin-bottom:16px">
                <label style="font-size:.82rem;font-weight:600;color:var(--text-muted);display:block;margin-bottom:4px">سعر البريد (لإعلان السعر فقط — يُطبّق على حوالات البريد)</label>
                <input type="number" step="0.01" name="post_rate" value="{{ msg.post_rate|default_if_none:'' }}" style="width:100%;padding:10px 14px;border-radius:10px;border:1px solid var(--border);font-size:.88rem">
            </div>
            <div style="margin-bottom:20px">
                <label style="font-size:.82rem;font-weight:600;color:var(--text-muted);display:block;margin-bottom:4px">نوع التحويل</label>
                <select name="transfer_type" style="width:100%;padding:10px 14px;border-radius:10px;border:1px solid var(--border);font-size:.88rem">
                    <option value="تحويل" {% if msg.transfer_type == 'تحويل' %}selected{% endif %}>تحويل</option>
                    <option value="محفظة" {% if msg.transfer_type == 'محفظة' %}selected{% endif %}>محفظة</option>
                    <option value="فودافون كاش" {% if msg.transfer_type == 'فودافون كاش' %}selected{% endif %}>فودافون كاش</option>
                    <option value="انستا كاش" {% if msg.transfer_type == 'انستا كاش' %}selected{% endif %}>انستا كاش</option>
                </select>
            </div>
            <div style="margin-bottom:20px">
                <label style="font-size:.82rem;font-weight:600;color:var(--text-muted);display:block;margin-bottom:4px">الاتجاه</label>
                <select name="direction" style="width:100%;padding:10px 14px;border-radius:10px;border:1px solid var(--border);font-size:.88rem">
                    <option value="وارد" {% if msg.direction == 'وارد' %}selected{% endif %}>وارد</option>
                    <option value="صادر" {% if msg.direction == 'صادر' %}selected{% endif %}>صادر</option>
                </select>
            </div>
            <button type="submit" style="width:100%;padding:12px;border-radius:10px;background:#25d366;color:#fff;font-weight:700;border:none;cursor:pointer;font-size:.9rem">
                <i class="bi bi-check-lg"></i> حفظ التعديلات
            </button>
        </form>
    </div>
</div>
{% endblock %}
